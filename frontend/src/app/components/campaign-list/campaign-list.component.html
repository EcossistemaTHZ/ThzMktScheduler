<mat-card class="campaign-card">
    <mat-card-header>
        <mat-card-title>Scheduled Campaigns</mat-card-title>
    </mat-card-header>

    <mat-card-content>
        <div class="table-container">
            <table mat-table [dataSource]="campaigns" class="mat-elevation-z0 full-width">

                <!-- Subject Column -->
                <ng-container matColumnDef="subject">
                    <th mat-header-cell *matHeaderCellDef> Subject </th>
                    <td mat-cell *matCellDef="let campaign"> {{campaign.subject}} </td>
                </ng-container>

                <!-- Scheduled At Column -->
                <ng-container matColumnDef="scheduled_at">
                    <th mat-header-cell *matHeaderCellDef> Scheduled At </th>
                    <td mat-cell *matCellDef="let campaign"> {{campaign.scheduled_at | date:'medium'}} </td>
                </ng-container>

                <!-- Destinations Column -->
                <ng-container matColumnDef="destinations">
                    <th mat-header-cell *matHeaderCellDef> Destinations </th>
                    <td mat-cell *matCellDef="let campaign"> All Users (Demo) </td>
                </ng-container>

                <!-- Status Column -->
                <ng-container matColumnDef="status">
                    <th mat-header-cell *matHeaderCellDef> Status </th>
                    <td mat-cell *matCellDef="let campaign">
                        <mat-chip-set>
                            <mat-chip [ngClass]="campaign.status">
                                {{campaign.status | titlecase}}
                            </mat-chip>
                        </mat-chip-set>
                    </td>
                </ng-container>

                <!-- Actions Column -->
                <ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef class="text-right"> Actions </th>
                    <td mat-cell *matCellDef="let campaign" class="text-right">
                        <button mat-icon-button color="warn" (click)="deleteCampaign(campaign.id!)" title="Delete">
                            <mat-icon>delete</mat-icon>
                        </button>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                <!-- Row shown when there is no matching data. -->
                <tr class="mat-row" *matNoDataRow>
                    <td class="mat-cell empty-cell" colspan="5">No campaigns scheduled. Create one to get started.</td>
                </tr>
            </table>
        </div>
    </mat-card-content>
</mat-card>
