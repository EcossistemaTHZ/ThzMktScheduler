<div class="user-manager-container">
    <!-- Create User -->
    <mat-card class="manager-card">
        <mat-card-header>
            <mat-card-title>Add User / Destination</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <form (ngSubmit)="onSubmit()" #userForm="ngForm" class="user-form">
                <mat-form-field appearance="outline" class="flex-grow">
                    <mat-label>Name</mat-label>
                    <input matInput [(ngModel)]="newUser.name" name="name" required placeholder="Full Name">
                </mat-form-field>

                <mat-form-field appearance="outline" class="flex-grow">
                    <mat-label>Email</mat-label>
                    <input matInput type="email" [(ngModel)]="newUser.email" name="email" required
                        placeholder="Email Address">
                </mat-form-field>

                <button mat-raised-button color="accent" type="submit" [disabled]="!userForm.valid" class="add-btn">
                    <mat-icon>person_add</mat-icon>
                    Add
                </button>
            </form>
        </mat-card-content>
    </mat-card>

    <!-- List -->
    <mat-card class="manager-card">
        <mat-card-header>
            <mat-card-title>Registered Users</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <div class="table-container">
                <table mat-table [dataSource]="users" class="mat-elevation-z0 full-width">

                    <ng-container matColumnDef="name">
                        <th mat-header-cell *matHeaderCellDef> Name </th>
                        <td mat-cell *matCellDef="let user"> {{user.name}} </td>
                    </ng-container>

                    <ng-container matColumnDef="email">
                        <th mat-header-cell *matHeaderCellDef> Email </th>
                        <td mat-cell *matCellDef="let user"> {{user.email}} </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                    <tr class="mat-row" *matNoDataRow>
                        <td class="mat-cell empty-cell" colspan="2">No users found.</td>
                    </tr>
                </table>
            </div>
        </mat-card-content>
    </mat-card>
</div>
