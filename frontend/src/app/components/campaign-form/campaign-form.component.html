<mat-card class="form-card">
    <mat-card-header>
        <mat-card-title>Create New Campaign</mat-card-title>
    </mat-card-header>

    <mat-card-content>
        <form (ngSubmit)="onSubmit()" #form="ngForm" class="campaign-form">
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Subject</mat-label>
                <input matInput [(ngModel)]="model.subject" name="subject" required placeholder="Enter email subject">
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Message Content</mat-label>
                <textarea matInput [(ngModel)]="model.message" name="message" required rows="4"
                    placeholder="Type your marketing message..."></textarea>
            </mat-form-field>

            <div class="row">
                <mat-form-field appearance="outline">
                    <mat-label>Schedule Date</mat-label>
                    <input matInput type="datetime-local" [(ngModel)]="model.scheduled_at" name="scheduled_at" required>
                </mat-form-field>

                <button mat-raised-button color="primary" type="submit" [disabled]="!form.valid" class="submit-btn">
                    <mat-icon>send</mat-icon>
                    Schedule Campaign
                </button>
            </div>
        </form>
    </mat-card-content>
</mat-card>
