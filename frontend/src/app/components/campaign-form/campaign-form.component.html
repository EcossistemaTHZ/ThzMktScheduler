<mat-card class="form-card">
    <mat-card-header>
        <mat-card-title>{{ 'CAMPAIGN_FORM.TITLE' | translate }}</mat-card-title>
    </mat-card-header>

    <mat-card-content>
        <form (ngSubmit)="onSubmit()" #form="ngForm" class="campaign-form">
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>{{ 'CAMPAIGN_FORM.SUBJECT' | translate }}</mat-label>
                <input matInput [(ngModel)]="model.subject" name="subject" required
                    [placeholder]="'CAMPAIGN_FORM.SUBJECT_PLACEHOLDER' | translate">
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>{{ 'CAMPAIGN_FORM.MESSAGE' | translate }}</mat-label>
                <textarea matInput [(ngModel)]="model.message" name="message" required rows="4"
                    [placeholder]="'CAMPAIGN_FORM.MESSAGE_PLACEHOLDER' | translate"></textarea>
            </mat-form-field>

            <div class="row">
                <mat-form-field appearance="outline">
                    <mat-label>{{ 'CAMPAIGN_FORM.SCHEDULE_DATE' | translate }}</mat-label>
                    <input matInput type="datetime-local" [(ngModel)]="model.scheduled_at" name="scheduled_at" required>
                </mat-form-field>

                <button mat-raised-button color="primary" type="submit" [disabled]="!form.valid" class="submit-btn">
                    <mat-icon>send</mat-icon>
                    {{ 'CAMPAIGN_FORM.SCHEDULE_BUTTON' | translate }}
                </button>
            </div>
        </form>
    </mat-card-content>
</mat-card>
