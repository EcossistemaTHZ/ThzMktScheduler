<mat-card class="campaign-card">
    <mat-card-header>
        <mat-card-title>
            {{ (isEditing ? 'CAMPAIGN_FORM.TITLE_EDIT' : 'CAMPAIGN_FORM.TITLE') | translate }}
        </mat-card-title>
    </mat-card-header>
    <mat-card-content>
        <form (ngSubmit)="onSubmit()" #campaignForm="ngForm" class="campaign-form-layout">
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>{{ 'CAMPAIGN_FORM.SUBJECT' | translate }}</mat-label>
                <input matInput [(ngModel)]="model.subject" name="subject" required
                    [placeholder]="'CAMPAIGN_FORM.SUBJECT_PLACEHOLDER' | translate">
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>{{ 'CAMPAIGN_FORM.MESSAGE' | translate }}</mat-label>
                <textarea matInput [(ngModel)]="model.message" name="message" required rows="4"
                    [placeholder]="'CAMPAIGN_FORM.MESSAGE_PLACEHOLDER' | translate"></textarea>
            </mat-form-field>

            <div class="form-row">
                <mat-form-field appearance="outline" class="flex-grow">
                    <mat-label>{{ 'CAMPAIGN_FORM.SCHEDULE_DATE' | translate }}</mat-label>
                    <input matInput type="datetime-local" [(ngModel)]="model.scheduled_at" name="scheduled_at" required>
                </mat-form-field>

                <div class="actions">
                    <button mat-raised-button color="primary" type="submit" [disabled]="!campaignForm.valid">
                        <mat-icon>{{ isEditing ? 'save' : 'send' }}</mat-icon>
                        {{ (isEditing ? 'COMMON.SAVE' : 'CAMPAIGN_FORM.SCHEDULE_BUTTON') | translate }}
                    </button>
                    <button mat-button type="button" color="warn" *ngIf="isEditing" (click)="cancelEdit()">
                        {{ 'COMMON.CANCEL' | translate }}
                    </button>
                </div>
            </div>
        </form>
    </mat-card-content>
</mat-card>
