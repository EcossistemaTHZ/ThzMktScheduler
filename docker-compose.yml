services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thz-mkt-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - APP_ENV=prod
      - APP_DEBUG=false
      - DB_DSN=sqlite:/app/data/database.sqlite
      - CORS_ORIGIN=*
    volumes:
      - mkt_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: thz-mkt-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  mkt_data:
